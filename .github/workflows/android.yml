name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # GitHub-hosted Ubuntu runners include Android command-line tools.
      # Do not use android-actions/setup-android@v3: it attempts to install
      # the removed legacy SDK package "tools" and fails before compilation.
      - name: Install Android API 35 and build tools
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::No sdkmanager executable found in $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-35" "build-tools;35.0.0"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile preview APK
        if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
        run: gradle --no-daemon --stacktrace -PdexlikeVersionCode="$((GITHUB_RUN_NUMBER + 1))" :app:assembleDebug

      - name: Upload preview APK
        if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: DexlikeLauncher-preview-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Compile and verify signed update APK
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          DEXLIKE_KEYSTORE_BASE64: ${{ secrets.DEXLIKE_KEYSTORE_BASE64 }}
          DEXLIKE_KEYSTORE_PASSWORD: ${{ secrets.DEXLIKE_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$DEXLIKE_KEYSTORE_BASE64" || -z "$DEXLIKE_KEYSTORE_PASSWORD" ]]; then
            echo "::error::Configure the Dexlike signing secrets before building an update APK. See README."
            exit 1
          fi
          umask 077
          export DEXLIKE_KEYSTORE
          DEXLIKE_KEYSTORE="$(mktemp "$RUNNER_TEMP/dexlike.XXXXXXXX.p12")"
          trap 'rm -f "$DEXLIKE_KEYSTORE"' EXIT
          printf '%s' "$DEXLIKE_KEYSTORE_BASE64" | base64 --decode > "$DEXLIKE_KEYSTORE"
          unset DEXLIKE_KEYSTORE_BASE64
          gradle --no-daemon --stacktrace -PdexlikeVersionCode="$((GITHUB_RUN_NUMBER + 1))" :app:assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Upload signed update APK
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: DexlikeLauncher-signed-update-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
